name: CI unlocked

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Unlocked deps
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - elixir: '1.14'
            otp: '26'
          - elixir: '1.15'
            otp: '26'
          - elixir: '1.16'
            otp: '26'
          - elixir: '1.17'
            otp: '27'
          - elixir: '1.18'
            otp: '27'
          - elixir: '1.19'
            otp: '28'
          - elixir: '1.20'
            otp: '29'
    steps:
    - uses: actions/checkout@v3
    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: ${{ matrix.elixir }}
        otp-version: ${{ matrix.otp }}
    - name: Restore dependencies cache
      uses: actions/cache@v3
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-
    - name: Unlock dependencies
      run: mix deps.unlock --all
    - name: Install dependencies
      run: mix deps.get
    - name: Compile dependencies
      run: mix compile.deps
    - name: Compile
      run: mix compile
    - name: Run tests
      run: mix test --trace
